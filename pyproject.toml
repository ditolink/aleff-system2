[project]
name = "aleff-system2"
version = "0.1.0"
requires-python = ">=3.11"
description = "Acervo fotográfico Aleff Thiago"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.0",
    "python-dotenv==1.2.2",
    "google-api-python-client==2.140.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
    "werkzeug==3.1.6",
    "waitress==3.0.2",
    "Pillow==10.4.0",
    "opencv-python-headless>=4.8,<5",
    "requests==2.32.3",
    "numpy==2.1.3",
    "cryptography>=50.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "node_modules", "data", "frontend/fotos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/services/clip_tagger.py", "backend/services/face_tagger.py"]

[tool.coverage.report]
fail_under = 0
