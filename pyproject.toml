[project]
name = "aleff-system2"
version = "0.1.0"
requires-python = ">=3.11"
description = "Acervo fotográfico Aleff Thiago"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "node_modules", "data", "frontend/fotos"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/services/clip_tagger.py", "backend/services/face_tagger.py"]

[tool.coverage.report]
fail_under = 0
