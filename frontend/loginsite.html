<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Entrar — Aleff Thiago</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/ui.css?v=20260801ay"/>
  <link rel="stylesheet" href="css/login.css?v=20260801ay"/>
  <link rel="stylesheet" href="css/logo.css"/>
  <script src="js/toast.js?v=3" defer></script>
  <script src="js/auth.js?v=20260808a" defer></script>
</head>
<body class="login-page">
  <div class="login-shell">
    <section class="stage" aria-label="Aleff Thiago">
      <a href="index.html" class="logo login-brand" aria-label="Aleff Thiago">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="13" r="6.5"/>
            <circle cx="12" cy="13" r="2.2" fill="currentColor" stroke="none"/>
            <path d="M8 7.2h8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo-text"><strong>ALEFF</strong><span>Thiago</span></span>
      </a>
      <img
        class="stage-photo"
        src="fotos/aleff-hero.jpg"
        alt="Aleff Thiago"
        decoding="async"
        fetchpriority="high"
      />
      <div class="stage-veil" aria-hidden="true"></div>
      <div class="stage-grain" aria-hidden="true"></div>
      <div class="stage-foot">
        <p class="stage-eyebrow anim-line d1">Minas Gerais · Estúdio</p>
        <h1 class="stage-title anim-line d2">
          Aleff
          <span class="anim-line d3">Thiago</span>
        </h1>
        <p class="stage-lead anim-line d4">Entrada da equipe. O acervo público continua aberto.</p>
      </div>
      <span class="frame-mark" aria-hidden="true">Acesso privado</span>
    </section>

    <main class="access" aria-label="Login">
      <div class="access-card stagger">
        <a href="index.html" class="logo access-logo" aria-label="Aleff Thiago">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="13" r="6.5"/>
              <circle cx="12" cy="13" r="2.2" fill="currentColor" stroke="none"/>
              <path d="M8 7.2h8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="logo-text"><strong>ALEFF</strong><span>Thiago</span></span>
        </a>

        <div class="access-divider" aria-hidden="true"></div>

        <form id="loginForm" class="access-form" autocomplete="on">
          <header class="access-head">
            <p class="ui-kicker">Acesso</p>
            <h2 class="ui-title access-title">Entrar<span class="ui-dot">.</span></h2>
            <p class="ui-sub access-sub">Usuário e senha da equipe.</p>
          </header>

          <div class="err" id="loginErr" role="alert"></div>

          <div class="fg">
            <label class="flbl" for="username">Usuário</label>
            <div class="finp-wrap">
              <input class="finput" id="username" name="username" type="text" autocomplete="username" required autofocus maxlength="64" placeholder="nome"/>
              <span class="ui-underline" aria-hidden="true"></span>
            </div>
          </div>
          <div class="fg">
            <label class="flbl" for="password">Senha</label>
            <div class="finp-wrap">
              <input class="finput" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="••••••••"/>
              <span class="ui-underline" aria-hidden="true"></span>
              <button type="button" class="eye-btn" id="togglePass" aria-label="Mostrar senha" title="Mostrar senha">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="ui-cta is-em ui-cta--block access-cta" type="submit" id="loginBtn">
            <span class="btn-txt send-label">Entrar</span>
            <span class="btn-spin" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>

          <p class="meta">Acesso exclusivo da equipe do estúdio.</p>
          <a class="back" href="index.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Portfólio
          </a>
        </form>

        <div id="sessionCard" class="access-form" hidden>
          <header class="access-head">
            <p class="live">Sessão · <b id="sessionUser">equipe</b></p>
            <h2 class="ui-title access-title">Sessão ativa<span class="ui-dot">.</span></h2>
            <p class="ui-sub access-sub" id="sessionSub">Conta conectada.</p>
          </header>
          <button class="ui-cta is-em ui-cta--block access-cta" type="button" id="continueBtn">
            <span class="btn-txt send-label">Continuar</span>
          </button>
          <button class="btn-ghost" type="button" id="logoutBtn">Sair</button>
          <a class="back" href="index.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Voltar ao portfólio
          </a>
        </div>
      </div>
    </main>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => document.body.classList.add('is-ready'));
  });

  function showErr(text) {
    err.textContent = text;
    err.classList.remove('show');
    void err.offsetWidth;
    err.classList.add('show');
  }

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('is-loading', on);
    const txt = btn.querySelector('.btn-txt');
    if (txt && !on) txt.textContent = 'Entrar';
  }

  function safeNext(raw) {
    let next = raw || '/dashboard.html';
    try { next = decodeURIComponent(next); } catch {}
    if (!next.startsWith('/') || next.startsWith('//')) return '/dashboard.html';
    const bare = {
      '/dashboard': '/dashboard.html',
      '/upload': '/upload.html',
      '/admin': '/admin.html',
      '/search': '/search.html',
      '/slots': '/slots.html',
      '/code': '/code.html',
      '/loginsite': '/dashboard.html',
    };
    if (bare[next]) return bare[next];
    if (next.endsWith('.html') || next.includes('.')) return next;
    return next.replace(/\/$/, '') + '.html';
  }

  const params = new URLSearchParams(location.search);
  const next = safeNext(params.get('next'));
  const justCleared = params.get('apagado') === '1';
  const form = document.getElementById('loginForm');
  const sessionCard = document.getElementById('sessionCard');
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  const pass = document.getElementById('password');
  const togglePass = document.getElementById('togglePass');

  function showLoginForm() {
    form.hidden = false;
    sessionCard.hidden = true;
  }

  function showClearedToast() {
    const flash = typeof Auth !== 'undefined' && Auth.consumeFlash
      ? Auth.consumeFlash()
      : null;
    if (typeof Toast === 'undefined') return;
    if (flash) {
      const fn = Toast[flash.type] || Toast.success;
      fn(flash.title || 'Sessão apagada', flash.message || '');
    } else if (justCleared) {
      Toast.success('Sessão apagada', 'Você saiu da conta.');
    }
  }

  function stripApagadoParam() {
    if (!justCleared) return;
    params.delete('apagado');
    const q = params.toString();
    history.replaceState({}, '', location.pathname + (q ? `?${q}` : '') + location.hash);
  }

  togglePass?.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    togglePass.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    togglePass.title = show ? 'Ocultar senha' : 'Mostrar senha';
    document.getElementById('eyeIcon').innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  });

  if (location.protocol === 'file:') {
    showErr('Abra pelo servidor: http://127.0.0.1:3001/loginsite.html (não abra o arquivo direto).');
    btn.disabled = true;
    return;
  }

  if (typeof Auth === 'undefined') {
    showErr('Falha ao carregar autenticação. Recarregue a página (Ctrl+F5).');
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    setLoading(true);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await Auth.login(username, password);
      if (!data || data.status === 'error' || !data.logged_in) {
        throw new Error((data && data.message) || 'Falha no login');
      }
      if (typeof Toast !== 'undefined') Toast.success('Bem-vindo', data.user || username);
      location.href = next;
    } catch (ex) {
      const msg = String(ex.message || '');
      const offline = /fetch|network|failed|offline|carregar/i.test(msg);
      showErr(offline
        ? 'Servidor offline. Abra o start.bat e use http://127.0.0.1:3001/loginsite.html'
        : (msg || 'Usuário ou senha inválidos.'));
      setLoading(false);
      try { await Auth.ensureCsrf(true); } catch {}
    }
  });

  // Logout acabou de acontecer → formulário + toast (nunca "Sessão ativa")
  if (justCleared) {
    try { await Auth.logout(); } catch { /* já limpo localmente */ }
    showLoginForm();
    showClearedToast();
    stripApagadoParam();
    try { await Auth.ensureCsrf(true); } catch (e) {
      showErr(e.message || 'Servidor offline. Rode o start.bat e tente de novo.');
    }
    return;
  }

  try {
    const me = await Auth.me(true);
    if (me && me.logged_in) {
      form.hidden = true;
      sessionCard.hidden = false;
      const who = me.user || 'equipe';
      const su = document.getElementById('sessionUser');
      if (su) su.textContent = who;
      document.getElementById('sessionSub').textContent =
        `${who}${me.role ? ' · ' + me.role : ''} — sessão pronta.`;
      document.getElementById('continueBtn').onclick = () => { location.href = next; };
      document.getElementById('logoutBtn').onclick = async () => {
        const btnOut = document.getElementById('logoutBtn');
        if (btnOut) btnOut.disabled = true;
        try {
          await Auth.logout();
          Auth.flashLoggedOut();
          showLoginForm();
          showClearedToast();
          try { await Auth.ensureCsrf(true); } catch {}
        } finally {
          if (btnOut) btnOut.disabled = false;
        }
      };
      return;
    }
  } catch { /* segue pro formulário */ }

  showClearedToast();
  try { await Auth.ensureCsrf(true); } catch (e) {
    showErr(e.message || 'Servidor offline. Rode o start.bat e tente de novo.');
  }
});
</script>
</body>
</html>
