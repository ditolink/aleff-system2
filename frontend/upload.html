<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Upload — Aleff Thiago</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/logo.css"/>
  <link rel="stylesheet" href="css/dev-bar.css?v=20260801av"/>
  <script src="js/toast.js" defer></script>
  <script src="js/auth.js?v=20260801au" defer></script>
  <script src="js/dev-bar.js?v=20260801av" defer></script>
  <style>
    .upload-page{min-height:100vh;padding:100px 48px 80px;max-width:900px;margin:0 auto}
    .up-eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#b8b8b8;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:12px}
    .up-eyebrow::before{content:'';width:16px;height:1px;background:#888;display:inline-block}
    .up-title-row{
      display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
      margin-bottom:48px;flex-wrap:wrap;
    }
    .up-title{font-size:clamp(36px,5vw,58px);font-weight:900;letter-spacing:-.03em;line-height:.95;margin:0}
    .up-title em{font-weight:300;font-style:italic;color:rgba(255,255,255,.5)}

 /* Cmera idle + quique no upload (60fps / GPU) */
    .up-cam{
      width:64px;height:50px;flex-shrink:0;color:#f5f5f5;
      transform-origin:50% 70%;
      will-change:transform;
      transform:translateZ(0);
      animation:up-cam-float 2.8s ease-in-out infinite;
    }
    .up-cam .cam-svg{width:100%;height:100%;overflow:visible;display:block}
    .up-cam.is-bounce{
      animation:up-cam-bounce .85s cubic-bezier(.22,.85,.3,1) both;
    }
    .up-cam.is-bounce .cam-rays{
      animation:up-cam-flash .85s ease-out both;
    }
    .up-cam.is-bounce .cam-iris{
      animation:up-cam-shutter .85s ease-out both;
    }
    @keyframes up-cam-float{
      0%,100%{transform:translate3d(0,0,0) rotate(-2deg)}
      50%{transform:translate3d(0,-6px,0) rotate(2deg)}
    }
    @keyframes up-cam-bounce{
      0%{transform:translate3d(0,0,0) rotate(-2deg) scale(1)}
      14%{transform:translate3d(0,-22px,0) rotate(10deg) scale(1.1)}
      28%{transform:translate3d(0,2px,0) rotate(-6deg) scale(.94)}
      42%{transform:translate3d(0,-12px,0) rotate(6deg) scale(1.06)}
      56%{transform:translate3d(0,1px,0) rotate(-3deg) scale(.98)}
      70%{transform:translate3d(0,-6px,0) rotate(3deg) scale(1.03)}
      84%{transform:translate3d(0,0,0) rotate(-1deg) scale(1)}
      100%{transform:translate3d(0,0,0) rotate(-2deg) scale(1)}
    }
    @keyframes up-cam-flash{
      0%,100%{opacity:.75;filter:none}
      18%{opacity:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.85))}
      40%{opacity:.5;filter:none}
    }
    @keyframes up-cam-shutter{
      0%,100%{opacity:.45;transform:scale(1)}
      16%{opacity:.08;transform:scale(.35)}
      28%{opacity:1;transform:scale(1.25)}
      50%{opacity:.45;transform:scale(1)}
    }
    @media (max-width:768px){
      .up-cam{animation:up-cam-float-lite 4s ease-in-out infinite}
      .up-cam.is-bounce{animation:up-cam-bounce-lite .95s cubic-bezier(.22,.85,.3,1) both}
      @keyframes up-cam-float-lite{
        0%,100%{transform:translate3d(0,0,0) rotate(-1deg)}
        50%{transform:translate3d(0,-4px,0) rotate(1deg)}
      }
      @keyframes up-cam-bounce-lite{
        0%{transform:translate3d(0,0,0) scale(1)}
        30%{transform:translate3d(0,-12px,0) rotate(4deg) scale(1.05)}
        55%{transform:translate3d(0,1px,0) scale(.98)}
        75%{transform:translate3d(0,-5px,0) scale(1.02)}
        100%{transform:translate3d(0,0,0) scale(1)}
      }
    }
    @media (prefers-reduced-motion:reduce){
      .up-cam,.up-cam.is-bounce,.up-cam.is-bounce .cam-rays,.up-cam.is-bounce .cam-iris{animation:none!important}
    }

    /* Drop zone */
    .drop-zone{
      border:2px dashed rgba(255,255,255,0.12);border-radius:20px;
      padding:60px 40px;text-align:center;cursor:pointer;
      transition:border-color .3s,background .3s,transform .3s,box-shadow .3s;
      background:linear-gradient(160deg,rgba(255,255,255,0.03) 0%,rgba(255,255,255,0.01) 100%);
      position:relative;margin-bottom:32px;
    }
    .drop-zone:hover{border-color:rgba(255,255,255,0.2);box-shadow:0 12px 32px rgba(0,0,0,.25)}
    .drop-zone.dragover{border-color:rgba(37,211,102,0.6);background:rgba(37,211,102,0.06);transform:translateY(-2px)}
    .drop-icon{margin-bottom:16px;display:flex;justify-content:center;color:#555}
    .drop-text{font-size:18px;font-weight:700;margin-bottom:8px}
    .drop-hint{font-size:13px;color:#555;margin-bottom:20px}
    .drop-browse{
      display:inline-flex;align-items:center;gap:8px;
      background:#f5f5f5;color:#0a0a0a;border:none;border-radius:10px;
      padding:11px 24px;font-family:'Lato',sans-serif;font-size:14px;
      font-weight:700;cursor:pointer;transition:opacity .2s;
    }
    .drop-browse:hover{opacity:.88}
    #fileInput{display:none}
    .drop-formats{font-size:11px;color:#444;margin-top:16px;letter-spacing:.08em;text-transform:uppercase}

    /* Preview queue */
    .file-queue{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
    .fq-item{
      display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
      border-radius:12px;padding:12px 16px;
    }
    .fq-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#111}
    .fq-thumb-ico{width:52px;height:52px;border-radius:8px;background:#111;display:flex;align-items:center;justify-content:center;font-size:22px;color:#444}
    .fq-info{min-width:0}
    .fq-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fq-size{font-size:12px;color:#555;margin-top:2px}
    .fq-bar-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:8px}
    .fq-bar{height:100%;background:#25d366;border-radius:2px;width:0;transition:width .3s}
    .fq-status{font-size:11px;margin-top:4px;color:#666}
    .fq-status.done{color:#25d366}
    .fq-status.err{color:#e53e3e}
    .fq-remove{background:none;border:none;color:#444;cursor:pointer;font-size:16px;padding:4px;border-radius:6px;transition:color .2s}
    .fq-remove:hover{color:#f5f5f5}

    /* Metadados */
    .meta-section{
      border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:28px;margin-bottom:28px;
      background:linear-gradient(160deg,#121212 0%,#0c0c0c 100%);
    }
    .meta-title{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#b8b8b8;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:12px}
    .meta-title::before{content:'';width:16px;height:1px;background:#888;display:inline-block}
    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .meta-fg{display:flex;flex-direction:column;gap:6px}
    .meta-fg.full{grid-column:span 2}
    .meta-lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#555;font-weight:300}
    .meta-inp{
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
      border-left:3px solid rgba(255,255,255,0.08);border-radius:10px;
      color:#f5f5f5;padding:11px 14px;font-size:14px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color .2s,border-left-color .2s;
    }
    .meta-inp:focus{border-color:rgba(255,255,255,0.2);border-left-color:#25d366}
    .meta-inp::placeholder{color:rgba(255,255,255,0.2)}
    textarea.meta-inp{min-height:70px;resize:vertical}

    /* Submit btn */
    .up-submit{
      width:100%;background:#16a34a;color:#fff;border:none;border-radius:12px;
      padding:16px;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;
      letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:10px;
      transition:opacity .2s,transform .15s;
    }
    .up-submit:hover{opacity:.9}
    .up-submit:disabled{opacity:.4;cursor:not-allowed}
    .up-submit.loading{animation:btn-pulse 1.2s ease infinite}
    @keyframes btn-pulse{0%,100%{opacity:.7}50%{opacity:1}}

    .drive-badge{
      display:inline-flex;align-items:center;gap:8px;margin:0 0 28px;
      padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.03);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#888;
    }
    .drive-dot{width:8px;height:8px;border-radius:50%;background:#444;transition:background .35s,box-shadow .35s}
    .drive-dot.on{background:#25d366;box-shadow:0 0 8px rgba(37,211,102,.55)}
    .drive-dot.off{background:#e53e3e;box-shadow:0 0 8px rgba(229,62,62,.4)}
    .drive-dot.warn{background:#f5c842;box-shadow:0 0 8px rgba(245,200,66,.4)}

    @media(max-width:768px){
      .upload-page{padding:88px 20px 60px}
      .meta-grid{grid-template-columns:1fr}
      .meta-fg.full{grid-column:span 1}
    }
  </style>
</head>

<main class="upload-page">
  <p class="up-eyebrow">Envio de mídia</p>
  <div class="up-title-row">
  <h1 class="up-title">Adicionar fotos<br><em>e vídeos</em></h1>
 <div class="up-cam" id="upCam" aria-hidden="true" title="Cmera">
      <svg class="cam-svg" viewBox="0 0 72 56">
        <g class="cam-rays" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M30 3v7"/><path d="M20 6l4 5.5"/><path d="M40 6l-4 5.5"/></g>
        <path class="cam-prism" d="M22 14h16l4 7H18l4-7z" fill="currentColor"/>
        <rect class="cam-body" x="8" y="20" width="44" height="26" rx="4" fill="currentColor"/>
        <path class="cam-grip" d="M48 23h12c2.2 0 4 1.8 4 4v12c0 2.2-1.8 4-4 4H48V23z" fill="currentColor"/>
        <circle class="cam-lens" cx="28" cy="33" r="11" fill="currentColor"/>

  </div>
  <div class="drive-badge" id="driveBadge" title="Status do Google Drive">
    <span class="drive-dot" id="driveDot"></span>

  <!-- Drop Zone -->
 <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Selecionar fotos ou vdeos">
    <span class="drop-icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg>
    </span>

    <button type="button" class="drop-browse" id="dropBrowse">

  <!-- Botão enviar -->

      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>

<script>
const API = '/api';
let selectedFiles = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (typeof Auth !== 'undefined') {
    const me = await Auth.requireLogin();
    if (!me) return;
  }
  checkDriveStatus();
  setInterval(checkDriveStatus, 120000);
});

async function checkDriveStatus() {
  const dot = document.getElementById('driveDot');
  const label = document.getElementById('driveLabel');
  if (!dot || !label) return;
  try {
    const r = await fetch(`${API}/drive/status`, { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    const online = r.ok && d.online === true && d.status !== 'error';
    if (online) {
      dot.className = 'drive-dot on';
      label.textContent = 'Drive online';
    } else {
      dot.className = 'drive-dot warn';
      label.textContent = 'Manutenção — Drive offline';
      if (typeof Toast !== 'undefined') {
        /* silencioso no polling; só falha inicial pode avisar via UI */
      }
    }
  } catch {
    dot.className = 'drive-dot off';
    label.textContent = 'Manutenção — sem conexão';
  }
}

/* -- Drop Zone ------------------------------------------------ */
const dropZone  = document.getElementById('dropZone');
const dropBrowse = document.getElementById('dropBrowse');
const fileInput = document.getElementById('fileInput');
const fileQueue = document.getElementById('fileQueue');
const metaSec   = document.getElementById('metaSection');
const upSubmit  = document.getElementById('upSubmit');

function openFilePicker(e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
 // S um click() dois abrem/fecham o dilogo e parece que no pega
  fileInput.click();
}

['dragenter', 'dragover'].forEach(type => {
  dropZone.addEventListener(type, ev => {
    ev.preventDefault();
    ev.stopPropagation();
    dropZone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(type => {
  dropZone.addEventListener(type, ev => {
    ev.preventDefault();
    ev.stopPropagation();
    dropZone.classList.remove('dragover');
    if (type === 'drop') addFiles(ev.dataTransfer && ev.dataTransfer.files);
  });
});

// Clique na zona (no no boto) abre o seletor
dropZone.addEventListener('click', (ev) => {
  if (ev.target.closest('#dropBrowse, #fileInput, button, a')) return;
  openFilePicker(ev);
});
dropZone.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' || ev.key === ' ') openFilePicker(ev);
});

// Boto: stopPropagation evita o 2 click da zona
dropBrowse.addEventListener('click', openFilePicker);

fileInput.addEventListener('change', () => {
  addFiles(fileInput.files);
  fileInput.value = ''; // permite escolher o mesmo arquivo de novo
});

function bounceCam() {
  const el = document.getElementById('upCam');
  if (!el) return;
  el.classList.remove('is-bounce');
  void el.offsetWidth;
  el.classList.add('is-bounce');
  const done = (ev) => {
    if (ev.target !== el || ev.animationName !== 'up-cam-bounce') return;
    el.classList.remove('is-bounce');
    el.removeEventListener('animationend', done);
  };
  el.addEventListener('animationend', done);
}

function addFiles(files) {
  if (!files || !files.length) return;
  let added = 0;
  Array.from(files).forEach(f => {
    if (!f || !f.size) return;
    if (!selectedFiles.find(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) {
      selectedFiles.push(f);
      added++;
    }
  });
  if (added) bounceCam();
  renderQueue();
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderQueue() {
  fileQueue.innerHTML = '';
  selectedFiles.forEach((f, i) => {
    const isVideo = f.type.startsWith('video/');
    const div = document.createElement('div');
    div.className = 'fq-item'; div.id = `fq-${i}`;
    div.innerHTML = `
      <div class="fq-thumb-ico">${isVideo ? 'Vídeo' : 'Foto'}</div>
      <div class="fq-info">
        <p class="fq-name">${esc(f.name)}</p>
        <p class="fq-size">${fmtSize(f.size)}</p>
        <div class="fq-bar-wrap"><div class="fq-bar" id="bar-${i}"></div></div>
        <p class="fq-status" id="st-${i}">Aguardando…</p>
      </div>
      <button class="fq-remove" onclick="removeFile(${i})">Remover</button>`;
    fileQueue.appendChild(div);

 // Preview de imagem (ObjectURL mais leve que FileReader no celular)
    if (!isVideo) {
      const thumb = div.querySelector('.fq-thumb-ico');
      const url = URL.createObjectURL(f);
      f._previewUrl = url;
      thumb.outerHTML = `<img class="fq-thumb" src="${url}" alt=""/>`;
    }
  });

  const hasFiles = selectedFiles.length > 0;
  metaSec.style.display = hasFiles ? 'block' : 'none';
  upSubmit.disabled      = !hasFiles;
}

function removeFile(i) {
  const f = selectedFiles[i];
  if (f && f._previewUrl) {
    try { URL.revokeObjectURL(f._previewUrl); } catch { /* ignore */ }
  }
  selectedFiles.splice(i, 1);
  renderQueue();
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

/* -- Upload ---------------------------------------------------- */
upSubmit.addEventListener('click', async () => {
  if (!selectedFiles.length) return;
  const me = await Auth.me();
  if (!me.logged_in) {
    location.href = '/loginsite.html?next=/upload.html';
    return;
  }
  upSubmit.disabled = true;
  upSubmit.classList.add('loading');
  upSubmit.textContent = 'Enviando…';

  const cat   = document.getElementById('mCat').value;
  const autor = document.getElementById('mAutor').value;
  const tags  = document.getElementById('mTags').value;
  const desc  = document.getElementById('mDesc').value;

  let ok = 0, fail = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const f   = selectedFiles[i];
    const bar = document.getElementById(`bar-${i}`);
    const st  = document.getElementById(`st-${i}`);

    st.textContent = 'Enviando…'; st.className = 'fq-status';

    const fd = new FormData();
    fd.append('file',       f);
    fd.append('nome',       f.name.replace(/\.[^/.]+$/, ''));
    fd.append('categoria',  cat);
    fd.append('autor',      autor);
    fd.append('tags',       tags);
    fd.append('descricao',  desc);

    try {
      let prog = 0;
      const progInterval = setInterval(() => {
        prog = Math.min(prog + 5, 90);
        bar.style.width = prog + '%';
      }, 200);

      const res  = await Auth.fetch(`${API}/media`, { method: 'POST', body: fd });
      clearInterval(progInterval);
      const data = await res.json();

      if (res.ok) {
        bar.style.width = '100%';
        st.textContent = `? ${data.message || 'Enviado!'}`; st.className = 'fq-status done';
        bounceCam();
        ok++;
      } else {
        bar.style.background = '#e53e3e'; bar.style.width = '100%';
        st.textContent = `? ${data.message || 'Falha'}`; st.className = 'fq-status err';
        fail++;
      }
    } catch(e) {
      bar.style.background = '#e53e3e';
      st.textContent = '? Erro de rede'; st.className = 'fq-status err';
      fail++;
    }
  }

  upSubmit.classList.remove('loading');
  upSubmit.disabled  = false;
  upSubmit.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Enviar para o Drive`;

  if (ok > 0) {
    Toast.success('Upload concluído', `${ok} arquivo(s) enviado(s) com sucesso.`);
  } else {
    Toast.error('Falha no upload', `${fail} arquivo(s) não foram enviados.`);
  }

  if (ok === selectedFiles.length) {
    selectedFiles = [];
    setTimeout(() => { renderQueue(); }, 2000);
  }
});

</script>
</body>
</html>
